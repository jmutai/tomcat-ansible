---
# Tomcat deployment playbook
#
# Override variables via:
#   - Extra vars:  ansible-playbook tomcat-setup.yml -e "tomcat_version=11.0.6 tomcat_major_version=11"
#   - Vault file:  ansible-playbook tomcat-setup.yml -e @vault.yml --ask-vault-pass
#   - Group vars:  group_vars/tomcat_nodes/main.yml
#
# Example vault.yml:
#   tomcat_manager_password: YourSecurePass1
#   tomcat_admin_password: YourSecurePass2

- name: Tomcat deployment playbook
  hosts: tomcat_nodes
  become: true
  roles:
    - tomcat
