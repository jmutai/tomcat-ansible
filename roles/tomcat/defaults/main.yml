---
# Tomcat version
tomcat_version: "10.1.34"
tomcat_major_version: "10"

# Download
tomcat_archive_url: "https://archive.apache.org/dist/tomcat/tomcat-{{ tomcat_major_version }}/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
tomcat_archive_dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"

# Installation
tomcat_install_dir: "/opt/tomcat"
tomcat_service_name: "tomcat"

# System user/group
tomcat_user: "tomcat"
tomcat_group: "tomcat"

# Java
tomcat_java_version: "17"

# Network
tomcat_port: 8080
tomcat_shutdown_port: 8005

# JVM tuning
tomcat_jvm_memory_min: "512M"
tomcat_jvm_memory_max: "1024M"
tomcat_catalina_opts: "-Xms{{ tomcat_jvm_memory_min }} -Xmx{{ tomcat_jvm_memory_max }} -Djava.awt.headless=true -Djava.security.egd=file:/dev/urandom"
tomcat_java_opts: ""

# Web UI credentials (use ansible-vault in production)
tomcat_manager_user: "manager"
tomcat_manager_password: "changeme"
tomcat_admin_user: "admin"
tomcat_admin_password: "changeme"

# Manager app access control (regex pattern for RemoteAddrValve)
tomcat_manager_allowed_ips: ".*"

# Firewall (RedHat family only)
tomcat_configure_firewall: true

# Health check
tomcat_health_check_enabled: true
tomcat_health_check_retries: 10
tomcat_health_check_delay: 5

# Install common sysadmin utilities
tomcat_install_utilities: true

# Extra packages to install
tomcat_extra_packages: []
